aid: arc-simulations
name: Arc Simulations
description: >-
  Arc Simulations is a London-based sports technology company, founded in 2022
  by Henry Smith and Michael Armenakis and part of the Techstars London Spring
  2024 accelerator cohort. Arc builds ball-tracking and simulation technology
  for cricket and other ball sports: professional-standard cricket balls carry
  embedded tracking tags that transmit position data to sensors up to 200 times
  per second, feeding a real-time simulation and analytics platform. The system
  predicts ball trajectory post-impact from velocity, angle and spin to deliver
  millimetre-accurate, autonomous feedback for every shot, with customisable
  field configurations that mirror live match scenarios. Arc serves players,
  coaches, scouts, analysts, broadcasters and fans through a hosted application
  (app.arcsim.io) and a player-facing app (player.arcsim.io) offering
  ball-by-ball 3D simulations. Arc's technology is built first for cricket but
  is designed to track nearly any sports ball. No public developer API, SDK, or
  API documentation is published at this time; this profile captures the
  company's identity and web/security posture in the API Evangelist network.
